model:
  name: "unsloth/gemma-4-E2B-it"
  backend: auto # auto | unsloth | hf
  trust_remote_code: auto # auto | true | false (hf backend only)
  dtype: "bfloat16"
  load_in_4bit: true
  target_total_vram_gb: 11

probe:
  micros: [1, 2, 4]
  repeats: 2
  safety: 0.95
  measure_eval: true

dataset:
  path: "openai/gsm8k"
  train_test_split:
    test_size: 0.1

training:
  global_batch_size: 64
  allow_approximate_batch: true
  max_batch_deviation: 0.05
  max_accum_steps: 64
  optim: "adamw_8bit"
  learning_rate: 3.0e-4
  lr_scheduler_type: "cosine"
  warmup_steps: 100
  num_train_epochs: 5
  max_steps: -1
  eval_save_strategy: "steps"
  eval_save_steps: 200
  save_total_limit: 2
  group_by_length: true
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  push_to_hub: false
  report_to: "tensorboard"
  early_stopping:
    enabled: true
    patience: 3
    threshold: 0.0

peft:
  r: 32
  use_gradient_checkpointing: true
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

output:
  output_dir: "./src/output"
  save_dataset: false
  save_config: true
  push:
    enabled: false
    repo_id: ""
    revision: "main"
    private: false
