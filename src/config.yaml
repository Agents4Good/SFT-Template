model:
  name: "unsloth/gemma-4-E2B-it"
  dtype: "bfloat16"
  load_in_4bit: true
  target_total_vram_gb: 5.0

dataset:
  path: "openai/gsm8k"
  train_test_split:
    test_size: 0.1

training:
  global_batch_size: 64
  optim: "adamw_8bit"
  learning_rate: 3.0e-4
  lr_scheduler_type: "cosine"
  warmup_steps: 100
  num_train_epochs: 5
  max_steps: -1
  eval_save_strategy: "steps"
  eval_save_steps: 10
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  push_to_hub: false
  report_to: "tensorboard"
  early_stopping:
    enabled: true
    patience: 3
    threshold: 0.0

peft:
  r: 32
  use_gradient_checkpointing: true

output:
  output_dir: "./src/output"
  save_dataset: false
  save_config: true
